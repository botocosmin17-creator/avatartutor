<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvatarTutor - AI Exam Prep with Avatar Tutor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            color: #00d4ff;
            margin: 0;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Login Screen */
        .login-screen {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .login-screen h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #00d4ff;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Buttons */
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #00d4ff;
            margin: 10px 5px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Exam Selection */
        .exam-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .exam-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .exam-card:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-5px);
        }

        .exam-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        /* Question Screen */
        .question-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .question-screen {
                grid-template-columns: 1fr;
            }
        }

        .avatar-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-canvas {
            width: 100%;
            max-width: 300px;
            height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .avatar-feedback {
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
        }

        .question-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        .question-text {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d4ff;
        }

        .option.selected {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .option.correct {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }

        .option.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }

        .feedback-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .feedback-message.correct {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .feedback-message.incorrect {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-box .label {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 8px;
        }

        .stat-box .value {
            font-size: 24px;
            color: #00d4ff;
            font-weight: bold;
        }

        /* Results Screen */
        .results-screen {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-screen h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .score {
            font-size: 48px;
            color: #4CAF50;
            margin: 20px 0;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .question-screen {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 20px;
            }

            .login-screen {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // GMAT Questions Database
        const GMAT_QUESTIONS = [
            {
                id: 1,
                skill: 'arithmetic',
                difficulty: 0.5,
                question: 'What is 15% of 240?',
                options: ['32', '36', '40', '48'],
                correct: 1,
                explanation: '15% of 240 = 0.15 × 240 = 36'
            },
            {
                id: 2,
                skill: 'algebra',
                difficulty: 0.6,
                question: 'Solve: 2x + 5 = 17',
                options: ['x = 4', 'x = 6', 'x = 8', 'x = 12'],
                correct: 1,
                explanation: '2x = 17 - 5 = 12, so x = 6'
            },
            {
                id: 3,
                skill: 'geometry',
                difficulty: 0.7,
                question: 'What is the area of a circle with radius 5?',
                options: ['25π', '10π', '50π', '100π'],
                correct: 0,
                explanation: 'Area = πr² = π(5)² = 25π'
            }
        ];

        // BKT Algorithm
        class BKTState {
            constructor() {
                this.p_k = 0.1; // probability student knows skill
                this.p_t = 0.1; // probability of learning
                this.p_g = 0.1; // probability of guessing
                this.p_s = 0.05; // probability of slip
            }

            update(isCorrect) {
                const p_correct = this.p_k * (1 - this.p_s) + (1 - this.p_k) * this.p_g;

                if (isCorrect) {
                    this.p_k = (this.p_k * (1 - this.p_s)) / p_correct * (1 - this.p_t) +
                              (this.p_k * (1 - this.p_s)) / p_correct * this.p_t;
                } else {
                    this.p_k = (this.p_k * this.p_s) / (1 - p_correct) * (1 - this.p_t);
                }

                return Math.min(Math.max(this.p_k, 0), 1);
            }
        }

        // Avatar Component
        function AvatarComponent({ emotion, isSpeaking }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Head
                ctx.fillStyle = '#fdbcb4';
                ctx.beginPath();
                ctx.arc(150, 100, 50, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                if (emotion === 'happy') {
                    ctx.fillRect(130, 85, 10, 10);
                    ctx.fillRect(170, 85, 10, 10);
                } else if (emotion === 'thinking') {
                    ctx.fillRect(130, 80, 10, 15);
                    ctx.fillRect(170, 80, 10, 15);
                }

                // Mouth
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (emotion === 'happy') {
                    ctx.arc(150, 120, 15, 0, Math.PI);
                } else if (isSpeaking) {
                    ctx.ellipse(150, 120, 10, 15, 0, 0, Math.PI * 2);
                } else {
                    ctx.moveTo(140, 120);
                    ctx.lineTo(160, 120);
                }
                ctx.stroke();

            }, [emotion, isSpeaking]);

            return <canvas ref={canvasRef} className="avatar-canvas" width="300" height="300" />;
        }

        // Main App Component
        function AvatarTutorApp() {
            const [screen, setScreen] = useState('login');
            const [username, setUsername] = useState('');
            const [examType, setExamType] = useState('GMAT');
            const [questions, setQuestions] = useState(GMAT_QUESTIONS);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [answered, setAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [attempts, setAttempts] = useState(0);
            const [bktStates, setBktStates] = useState({
                arithmetic: new BKTState(),
                algebra: new BKTState(),
                geometry: new BKTState(),
            });
            const [avatarEmotion, setAvatarEmotion] = useState('thinking');
            const [isSpeaking, setIsSpeaking] = useState(false);

            const handleLogin = () => {
                if (username.trim()) {
                    setScreen('exam-select');
                }
            };

            const handleExamSelect = (exam) => {
                setExamType(exam);
                setCurrentQuestionIdx(0);
                setScore(0);
                setAttempts(0);
                setSelectedAnswer(null);
                setAnswered(false);
                setScreen('question');
            };

            const handleAnswerSelect = (index) => {
                if (!answered) {
                    setSelectedAnswer(index);
                }
            };

            const handleSubmitAnswer = () => {
                const question = questions[currentQuestionIdx];
                const isCorrect = selectedAnswer === question.correct;

                // Update BKT
                const newBktStates = { ...bktStates };
                const bkt = newBktStates[question.skill];
                bkt.update(isCorrect);

                setBktStates(newBktStates);

                // Update score
                if (isCorrect) {
                    setScore(score + 1);
                    setAvatarEmotion('happy');
                } else {
                    setAvatarEmotion('thinking');
                }

                setAttempts(attempts + 1);
                setAnswered(true);
            };

            const handleNextQuestion = () => {
                if (currentQuestionIdx < questions.length - 1) {
                    setCurrentQuestionIdx(currentQuestionIdx + 1);
                    setSelectedAnswer(null);
                    setAnswered(false);
                } else {
                    setScreen('results');
                }
            };

            const handleRestart = () => {
                setScreen('login');
                setUsername('');
                setScore(0);
                setAttempts(0);
                setBktStates({
                    arithmetic: new BKTState(),
                    algebra: new BKTState(),
                    geometry: new BKTState(),
                });
            };

            const currentQuestion = questions[currentQuestionIdx];
            const progress = ((currentQuestionIdx + 1) / questions.length) * 100;
            const avgMastery = Object.values(bktStates).reduce((sum, bkt) => sum + bkt.p_k, 0) / 3;

            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🎓 AvatarTutor - AI Exam Prep</h1>
                    </div>

                    <div className="content">
                        {screen === 'login' && (
                            <div className="screen login-screen">
                                <h2>Welcome to AvatarTutor</h2>
                                <div className="form-group">
                                    <label>Your Name</label>
                                    <input
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="Enter your name"
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                    />
                                </div>
                                <button className="btn-primary" onClick={handleLogin}>
                                    Get Started
                                </button>
                            </div>
                        )}

                        {screen === 'exam-select' && (
                            <div className="screen">
                                <h2 style={{ textAlign: 'center', marginBottom: '30px' }}>
                                    Hi {username}! Choose Your Exam
                                </h2>
                                <div className="exam-selection">
                                    {['GMAT', 'IELTS', 'TOEFL', 'CFA Level 1'].map((exam) => (
                                        <div
                                            key={exam}
                                            className="exam-card"
                                            onClick={() => handleExamSelect(exam)}
                                        >
                                            <h3>{exam}</h3>
                                            <p>Start Practice Test</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {screen === 'question' && currentQuestion && (
                            <div className="screen question-screen">
                                <div className="avatar-section">
                                    <AvatarComponent emotion={avatarEmotion} isSpeaking={isSpeaking} />
                                    <div className="avatar-feedback">
                                        {answered && selectedAnswer === currentQuestion.correct
                                            ? '✅ Great job!'
                                            : answered
                                            ? '💡 Keep practicing!'
                                            : '🤔 Think carefully...'}
                                    </div>
                                </div>

                                <div className="question-section">
                                    <div className="progress-bar">
                                        <div
                                            className="progress-fill"
                                            style={{ width: `${progress}%` }}
                                        ></div>
                                    </div>

                                    <h2>Question {currentQuestionIdx + 1} of {questions.length}</h2>
                                    <div className="question-text">{currentQuestion.question}</div>

                                    <div className="options">
                                        {currentQuestion.options.map((option, idx) => (
                                            <div
                                                key={idx}
                                                className={`option ${
                                                    selectedAnswer === idx ? 'selected' : ''
                                                } ${
                                                    answered && idx === currentQuestion.correct
                                                        ? 'correct'
                                                        : answered &&
                                                          selectedAnswer === idx &&
                                                          idx !== currentQuestion.correct
                                                        ? 'incorrect'
                                                        : ''
                                                }`}
                                                onClick={() => handleAnswerSelect(idx)}
                                            >
                                                {String.fromCharCode(65 + idx)}) {option}
                                            </div>
                                        ))}
                                    </div>

                                    {answered && (
                                        <div
                                            className={`feedback-message ${
                                                selectedAnswer === currentQuestion.correct
                                                    ? 'correct'
                                                    : 'incorrect'
                                            }`}
                                        >
                                            <strong>Explanation:</strong> {currentQuestion.explanation}
                                        </div>
                                    )}

                                    <div className="stats">
                                        <div className="stat-box">
                                            <div className="label">Correct</div>
                                            <div className="value">{score}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="label">Attempted</div>
                                            <div className="value">{attempts}</div>
                                        </div>
                                        <div className="stat-box">
                                            <div className="label">Mastery</div>
                                            <div className="value">{(avgMastery * 100).toFixed(0)}%</div>
                                        </div>
                                    </div>

                                    {!answered ? (
                                        <button
                                            className="btn-primary"
                                            onClick={handleSubmitAnswer}
                                            disabled={selectedAnswer === null}
                                            style={{
                                                opacity: selectedAnswer === null ? 0.5 : 1,
                                            }}
                                        >
                                            Submit Answer
                                        </button>
                                    ) : (
                                        <button className="btn-primary" onClick={handleNextQuestion}>
                                            {currentQuestionIdx === questions.length - 1
                                                ? 'See Results'
                                                : 'Next Question'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {screen === 'results' && (
                            <div className="screen results-screen">
                                <h2>🎉 Practice Complete!</h2>
                                <div className="score">{score} / {questions.length}</div>
                                <p style={{ fontSize: '18px', marginBottom: '20px' }}>
                                    You got {((score / questions.length) * 100).toFixed(0)}% correct!
                                </p>
                                <p style={{ color: '#b0b0b0', marginBottom: '30px' }}>
                                    Your mastery level: {(avgMastery * 100).toFixed(0)}%
                                </p>
                                <div className="button-group">
                                    <button className="btn-secondary" onClick={() => handleExamSelect(examType)}>
                                        Try Again
                                    </button>
                                    <button className="btn-secondary" onClick={() => setScreen('exam-select')}>
                                        Change Exam
                                    </button>
                                    <button className="btn-secondary" onClick={handleRestart}>
                                        Logout
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AvatarTutorApp />);
    </script>
</body>
</html>
